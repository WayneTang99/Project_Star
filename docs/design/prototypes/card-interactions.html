</style></head><body>

</defs></svg>
<main class="app">
<header class="topbar"><div class="brand"><span class="brandmark">✧</span><div><strong>PROJECT STAR</strong><small>星 辰 之 旅</small></div></div><div class="journey" aria-label="第2轮，第3回合"><div class="round">第 2 轮<strong>03 / 08</strong></div><span class="turn past"></span><span class="turn past"></span><span class="turn active"></span><span class="turn" title="怪物战"></span><span class="turn"></span><span class="turn"></span><span class="turn"></span><span class="turn" title="玩家对战"></span></div><div class="economy"><span class="income">每轮收入 <b>+5</b></span><span class="money"><svg><use href="#i-coin"/></svg><span id="wealth">34</span></span></div></header>
<nav class="modebar" aria-label="预览页面"><div class="tabs"><button class="tab active" data-mode="shop">商店</button><button class="tab" data-mode="encounter">遭遇</button><button class="tab" data-mode="battle">战斗</button><button class="tab" data-mode="rewards">奖励</button></div><span class="previewtag">界面风格预览</span></nav>
<section class="stage" id="stage" aria-label="当前阶段"></section>
<section class="board-section"><div class="board-heading"><h2>战 场<span>10 / 10</span></h2><span class="board-tip">悬停查看卡牌 · 点击固定详情</span></div><div class="board" id="battlefield" aria-label="战场卡牌"></div></section>

<section class="hero-panel" aria-label="英雄状态"><div class="portrait" id="hero-portrait"><span class="hero-level">4</span></div><div><div class="hero-name">帕拉帝恩<span>圣骑士 · 光的守望者</span></div><div class="bars"><div class="bar" aria-label="生命450，最大生命600"><div class="bar-fill" style="--progress:75%"></div><div class="bar-label">450 / 600</div></div><div class="bar mana" aria-label="魔法80，最大魔法100"><div class="bar-fill" style="--progress:80%"></div><div class="bar-label">80 / 100</div></div></div><div class="hero-skills" id="hero-skills"></div><div class="hero-meta"><span>经验 <b>6 / 10</b></span><span>声望 <b>18</b></span><span>胜场 <b>3 / 10</b></span></div></div><div class="hero-right"><div class="stats"><span>护甲<b>25</b></span><span>再生<b>10</b></span></div><button class="goldbtn" id="continue">继续旅程　→</button></div></section>
<section class="prototype-controls" aria-label="交互原型预览"><div class="progress-presets"><span>任务进度预览</span><button data-progress="0">0 次</button><button data-progress="35" class="active">35 次</button><button data-progress="75">75 次</button><button data-progress="120">120 次</button></div><span>商品／奖励：点击获取 · 右键固定详情</span></section><footer class="bottomline"><span>小 / 中 / 大型卡牌共用构图 · 预览数值为展示示例</span><div class="themes"><span>桌面配色</span><button class="theme active" data-theme="green">森林金</button><button class="theme" data-theme="blue">星辉蓝</button></div></footer>
</main><aside class="tooltip" id="tooltip" role="dialog" aria-label="卡牌详情" aria-hidden="true"></aside><div class="toast" id="toast" role="status"></div>
<script>

const ASSETS = {"potion": "assets/potion.jpg", "mace": "assets/mace.jpg", "defend": "assets/defend.jpg", "smite": "assets/smite.jpg", "hero": "assets/hero.jpg", "forest": "assets/forest.jpg", "boarEncounter": "assets/boarEncounter.jpg", "boar": "assets/boar.jpg", "cauldron": "assets/cauldron.jpg", "armguard": "assets/armguard.jpg", "charge": "assets/charge.jpg", "toad": "assets/toad.jpg", "berries": "assets/berries.jpg", "shop": "assets/shop.jpg", "hammer": "assets/hammer.jpg", "ascendant": "../../../art/ui/card-face/artwork/ascendant-illustration.png", "griffin": "../../../art/ui/card-face/artwork/holy_griffin-illustration-refresh.png"};
// 独立界面草稿的数据，只驱动本页预览交互。
const cards = {
 hammer:{name:'审判之锤',art:'hammer',span:3,level:3,elements:['light'],effects:[['damage','20%']],value:24,cool:6,tags:['大型','装备','光'],desc:['<b class="keyword">发动</b>　对敌方英雄造成其最大生命 <strong>20%</strong> 的普通伤害。']},
 armguard:{name:'臂铠',art:'armguard',span:1,level:2,elements:['general'],effects:[['damage','10'],['armor','10']],value:4,cool:5,tags:['小型','装备'],desc:['<b class="keyword">发动</b>　造成 <strong>10</strong> 伤害，并获得 <strong>10</strong> 护甲。','<b class="keyword">光环</b>　具有 <strong>1</strong> 层多重，每次额外发动一次。']},
 boar:{name:'野猪',art:'boar',span:2,level:2,elements:['general'],effects:[['damage','30']],value:8,cool:6,tags:['中型','野兽'],desc:['<b class="keyword">发动</b>　造成 <strong>30 × 己方英雄当前生命比例</strong> 的普通伤害。']},
 toad:{name:'碧玉蟾',art:'toad',span:2,level:2,elements:['general'],effects:[['poison','16']],value:16,cool:5,tags:['中型','野兽'],desc:['<b class="keyword">发动</b>　施加等同于此卡牌当前价值的 <strong>中毒</strong>。','<b class="keyword">被动</b>　开战时位于战场区，每场战斗后价值永久增加 <strong>5</strong>。']},
 mace:{name:'钉头页锤',art:'mace',span:1,level:3,elements:['general'],effects:[['damage','40']],value:8,cool:5,tags:['小型','装备'],desc:['<b class="keyword">发动</b>　造成 <strong>40</strong> 普通伤害。','<b class="keyword">光环</b>　敌方英雄有护甲时，伤害翻倍。']},
 potion:{name:'小型生命药水',art:'potion',span:1,level:2,elements:['general'],effects:[['healing','80']],value:4,cool:3,tags:['小型','消耗品'],desc:['<b class="keyword">发动</b>　治疗己方英雄 <strong>80</strong> 生命。','<b class="keyword">消耗</b>　使用后摧毁，仅本场战斗生效。']},
 berries:{name:'浆果',art:'berries',span:1,level:1,elements:['wood'],effects:[],value:2,cool:null,tags:['小型','植物'],desc:['<b class="keyword">出售</b>　提供英雄永久属性奖励。']},
 cauldron:{name:'炼金坩埚',art:'cauldron',span:2,level:3,elements:['water','wood'],effects:[['poison','12'],['mana','8']],value:16,cool:5,tags:['中型','构图示例'],desc:['<b class="keyword">构图展示</b>　用于查看双元素、两种效果与宝石孔同时出现的效果。'],sockets:3}
};

cards.ascendant={name:'登神者',art:'ascendant',span:2,level:1,elements:['general'],effects:[['damage','1']],value:2,cool:3,tags:['中型','人类','无属性'],desc:['<b class="keyword">发动</b>　造成此卡牌攻击力的伤害（初始攻击力 <strong>1</strong>）。','<b class="keyword">回响</b>　当此卡牌发动后，攻击力永久增加 <strong>1</strong>；包含多重的额外发动。'],quests:[{target:20,title:'力量觉醒',reward:'攻击力 <strong>+80</strong>。'},{target:60,title:'圣光共鸣',reward:'获得 <strong>多重 1</strong>，此卡牌改为 <strong>光属性</strong>。'},{target:120,title:'登神之路',reward:'发动时额外施加当前攻击力 <strong>10% 的灼伤</strong>（向下取整），并获得 <strong>神明</strong> 标签。'}]};
cards.griffin={name:'神圣狮鹫',art:'griffin',span:3,level:2,elements:['light'],effects:[],value:6,cool:5,tags:['大型','野兽','坐骑','光'],desc:['<b class="keyword">发动</b>　使相邻己方卡牌获得 <strong>1 秒疾速</strong>；此卡牌和随机一张相邻己方人类卡牌进入 <strong>飞行</strong>。','<b class="keyword">回响</b>　当相邻己方人类卡牌获得疾速后，该卡牌攻击增加 <strong>10</strong>。']};
const shopItems=[['mace',8],['ascendant',12],['hammer',20]],rewardKeys=['armguard','ascendant','griffin'];

const rarity=['','#bfc1b4','#67b0dc','#ac86da','#e3a152','#d46b65'];
const elementSymbols={general:'◇',light:'☼',wood:'♧',water:'≈'};
const elementNames={general:'无属性',light:'光属性',wood:'木属性',water:'水属性'};
const effectNames={damage:'伤害',armor:'护甲',poison:'中毒',healing:'治疗',mana:'魔法'};
const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
let mode='shop',wealth=34,pinned=null,activeCard=null,toastTimer,battleTimer,hideTimer,playing=false,questProgress=35;
const soldOffers=new Set(),claimedRewards=new Set();
let benchKeys=['potion','berries','cauldron'];
const battlefieldKeys=['griffin','ascendant','boar','toad','mace'];
function cardHTML(key,action='',price=0,unavailable=false){
 const c=cards[key],label=action?(unavailable?'已'+(action==='buy'?'购买':'获取'):action==='buy'?`点击购买，${price}金币`:'点击获取'):'查看详情';
 return `<div class="card" tabindex="0" role="button" aria-label="${c.name}，${c.level}级，${label}" aria-disabled="${unavailable}" data-card="${key}" data-action="${action}" data-price="${price}" style="--span:${c.span};--rarity:${rarity[c.level]};--art:url('${ASSETS[c.art]}')"><div class="card-art"></div><div class="sockets" aria-label="${c.sockets??1}个宝石孔">${Array.from({length:c.sockets??1},(_,i)=>`<i class="socket ${i===1?'filled':''}" aria-label="宝石孔 ${i+1} · ${i===1?'已镶嵌':'空孔'}"></i>`).join('')}</div><div class="elements">${c.elements.map(e=>`<span class="element ${e}" aria-label="${elementNames[e]}">${elementSymbols[e]}</span>`).join('')}</div><div class="effects">${c.effects.map(([kind,val])=>`<span class="effect ${kind}" aria-label="${effectNames[kind]} ${val}">${icon(kind)}<span class="num">${val}</span></span>`).join('')}</div><span class="value" aria-label="价值 ${c.value}">${icon('coin')}${c.value}</span></div>`
}
function drawBoards(){document.querySelector('#battlefield').innerHTML=battlefieldKeys.map(key=>cardHTML(key)).join('');let used=benchKeys.reduce((n,k)=>n+cards[k].span,0);document.querySelector('#bench').innerHTML=benchKeys.map(key=>cardHTML(key)).join('')+Array.from({length:10-used},(_,i)=>`<div class="empty" data-slot="${used+i+1}"><span>✧</span></div>`).join('');document.querySelector('#bench-count').textContent=`${used} / 10`;bindCards()}
function stageSide(title,desc,asset,actions=''){return `<div class="stage-side" style="--stage-art:url('${ASSETS[asset]}')"><span class="eyebrow">第 3 回合 · ${mode==='shop'?'4 级商店':mode==='battle'?'怪物遭遇':'旅途抉择'}</span><h1>${title}</h1><p>${desc}</p>${actions}</div>`}
function offerHTML(k,action,price=0){const sold=(action==='buy'?soldOffers:claimedRewards).has(k);return `<div class="offer ${sold?'sold':''}" data-offer="${k}">${cardHTML(k,action,price,sold)}<div class="offer-info"><div class="offer-name">${cards[k].name}</div><div class="cooldown">${icon('clock')}${cards[k].cool??0}.0 秒</div><span class="offer-price">${sold?(action==='buy'?'已购买':'已获取'):action==='buy'?`${icon('coin')}${price}`:'点击获取'}</span><span class="offer-hint">${sold?'右键查看详情':action==='buy'?'点击卡牌购买':'加入备战区'}</span></div></div>`}
function drawStage(){
 hideTooltip(true);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));let html='';
 if(mode==='shop') html=stageSide('旅人集市','悬停查看详情，<br>点击卡牌即可购买。','shop',`<div class="stage-actions"><button class="subtlebtn" id="refresh">${icon('refresh')}刷新 · 8</button><button class="subtlebtn" id="leave">离开 →</button></div>`)+`<div class="stage-body">${shopItems.map(([k,p])=>offerHTML(k,'buy',p)).join('')}</div>`;
 else if(mode==='rewards') html=stageSide('战利品','悬停查看奖励，<br>点击卡牌即可获取。','boarEncounter')+`<div class="stage-body">${rewardKeys.map(k=>offerHTML(k,'claim')).join('')}</div>`;
 else if(mode==='encounter') html=stageSide('林间岔路','命运藏在每一次选择里。<br>下一站，将通往何处？','forest')+`<div class="stage-body">${[['shop','旅人集市','购买卡牌，完善你的构筑','shop'],['forest','暮歌丛林','采摘植物，或探寻林间秘密','forest'],['boarEncounter','野猪巢穴','迎战怪物，获取战斗奖励','battle']].map(([art,name,desc,target])=>`<button class="encounter" data-encounter="${target}" style="--scene-art:url('${ASSETS[art]}')"><span class="enc-icon">✧</span><div><strong>${name}</strong><small>${desc}</small></div></button>`).join('')}</div>`;
 else html=stageSide('战斗准备','确认你的阵容。<br>让每一张卡牌各尽其用。','boarEncounter')+`<div class="stage-body"><div class="battle-summary"><div class="enemy-portrait" style="--enemy-art:url('${ASSETS.boarEncounter}')"><strong>林地野猪</strong></div><span class="battle-vs">VS</span><div class="battle-text"><span class="eyebrow">怪物战 · 第 2 轮</span><h3 id="battle-status">准备迎战</h3><p>伤害、护甲与中毒，组合出你的制胜之道。</p><div class="bar" style="height:20px"><div class="bar-fill" id="enemy-health" style="--progress:100%"></div><div class="bar-label" id="enemy-label" style="top:1px">600 / 600</div></div><div class="battle-controls"><button class="goldbtn" id="play">开始战斗</button><button class="subtlebtn" id="skip">跳过预览</button></div></div></div></div>`;
 document.querySelector('#stage').innerHTML=html;bindCards();
 document.querySelector('#refresh')?.addEventListener('click',()=>{if(wealth<8)return toast('金币不足');wealth-=8;soldOffers.clear();updateMoney();drawStage();toast('商店已刷新')});
 document.querySelector('#leave')?.addEventListener('click',()=>setMode('encounter'));
 document.querySelectorAll('[data-encounter]').forEach(b=>b.onclick=()=>b.dataset.encounter==='forest'?toast('踏入暮歌丛林，听见了风中的低语'):setMode(b.dataset.encounter));
 document.querySelector('#play')?.addEventListener('click',playBattle);document.querySelector('#skip')?.addEventListener('click',finishBattle)
}
function setMode(next){clearInterval(battleTimer);playing=false;document.querySelector('#battlefield').classList.remove('battle-active');mode=next;drawStage();document.querySelector('#continue').textContent=mode==='battle'?'开始战斗　→':'继续旅程　→'}
function acquireCard(el){
 const key=el.dataset.card,action=el.dataset.action,claimed=action==='buy'?soldOffers:claimedRewards,price=action==='buy'?Number(el.dataset.price):0;
 if(claimed.has(key))return toast(action==='buy'?'此商品已购买':'此奖励已获取');
 if(wealth<price)return toast('金币不足，未购买');
 if(benchKeys.reduce((n,k)=>n+cards[k].span,0)+cards[key].span>10)return toast('备战区空间不足，未获取');
 wealth-=price;claimed.add(key);benchKeys.push(key);updateMoney();drawBoards();drawStage();toast(`${cards[key].name} 已${action==='buy'?'购买':'获取'}，加入备战区`)
}
function updateMoney(){document.querySelector('#wealth').textContent=wealth}
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function playBattle(){if(playing){playing=false;clearInterval(battleTimer);document.querySelector('#play').textContent='继续';document.querySelector('#battlefield').classList.remove('battle-active');return}if(!document.querySelector('#enemy-health'))return;playing=true;document.querySelector('#battlefield').classList.add('battle-active');document.querySelector('#play').textContent='暂停';document.querySelector('#battle-status').textContent='交锋中';let health=Number(document.querySelector('#enemy-health').dataset.health??600);battleTimer=setInterval(()=>{health=Math.max(0,health-36);document.querySelector('#enemy-health').dataset.health=health;document.querySelector('#enemy-health').style.setProperty('--progress',`${health/6}%`);document.querySelector('#enemy-label').textContent=`${health} / 600`;if(health===0)finishBattle()},700)}
function finishBattle(){clearInterval(battleTimer);playing=false;document.querySelector('#battlefield').classList.remove('battle-active');document.querySelector('#battle-status').textContent='战斗胜利';document.querySelector('#enemy-health').style.setProperty('--progress','0%');document.querySelector('#enemy-health').dataset.health=0;document.querySelector('#enemy-label').textContent='0 / 600';document.querySelector('#play').disabled=true;document.querySelector('#play').textContent='已结束';document.querySelector('#continue').textContent='继续旅程　→';toast('战斗预览结束')}
function questHTML(c){if(!c.quests)return '';return `<section class="quest-section" aria-label="成长任务"><div class="quest-heading"><h4>成长任务</h4><span class="quest-total">累计发动 <b>${questProgress}</b> 次</span></div>${c.quests.map(q=>{const current=Math.min(questProgress,q.target),done=questProgress>=q.target;return `<div class="quest ${done?'complete':''}"><div class="quest-top"><strong class="quest-name">${q.title}</strong><span class="quest-state">${done?'✓ 已解锁':'累计发动 '+q.target+' 次'}</span></div><div class="quest-meter"><div class="quest-bar" role="progressbar" aria-label="${q.title}" aria-valuemin="0" aria-valuemax="${q.target}" aria-valuenow="${current}"><div class="quest-fill" style="--progress:${current/q.target*100}%"></div></div><span class="quest-count">${current} / ${q.target}<small>次</small></span></div><p class="quest-reward"><span>${done?'已生效':'达标奖励'}</span>${q.reward}</p></div>`}).join('')}</section>`}
function positionTooltip(el){const tip=document.querySelector('#tooltip'),r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;let left=r.right+16;if(left+w>innerWidth-12)left=r.left-w-16;tip.style.left=`${Math.max(12,Math.min(innerWidth-w-12,left))}px`;tip.style.top=`${Math.max(12,Math.min(innerHeight-h-12,r.top))}px`}
function showTooltip(el){
 clearTimeout(hideTimer);activeCard=el;const c=cards[el.dataset.card],tip=document.querySelector('#tooltip');document.querySelectorAll('[aria-describedby="tooltip"]').forEach(node=>node.removeAttribute('aria-describedby'));
 const action=el.dataset.action,context=action==='buy'?`${icon('coin')} ${el.dataset.price} 金币 · 左键购买卡牌`:action==='claim'?'左键获取卡牌 · 加入备战区':'';
 tip.innerHTML=`<button class="detail-close" aria-label="关闭详情">×</button><header><div><div class="tagrow">${c.tags.map(t=>`<span>${t}</span>`).join('')}</div><h3>${c.name}</h3></div>${c.cool?`<div class="cool-circle">${c.cool}.0<small>秒</small></div>`:''}</header><div class="details-scroll"><article>${c.desc.map(d=>`<p>${d}</p>`).join('')}</article>${questHTML(c)}</div><footer><span>${c.level}级 · ${c.elements.map(e=>elementNames[e]).join(' / ')}</span><span>价值 ${icon('coin')} <b>${c.value}</b></span></footer>${context?`<p class="detail-context">${context}</p>`:''}`;
 tip.classList.add('visible');tip.classList.toggle('pinned',Boolean(pinned));tip.setAttribute('aria-hidden','false');el.setAttribute('aria-describedby','tooltip');tip.querySelector('.detail-close').onclick=()=>hideTooltip(true);positionTooltip(el)
}
function hideTooltip(force=false){if(pinned&&!force)return;clearTimeout(hideTimer);pinned=null;activeCard=null;const tip=document.querySelector('#tooltip');tip.classList.remove('visible','pinned');tip.setAttribute('aria-hidden','true');document.querySelectorAll('[aria-describedby="tooltip"]').forEach(el=>el.removeAttribute('aria-describedby'))}
function scheduleHide(){if(pinned)return;clearTimeout(hideTimer);hideTimer=setTimeout(()=>hideTooltip(),160)}
function bindCards(){document.querySelectorAll('.card').forEach(el=>{
 el.onmouseenter=()=>{clearTimeout(hideTimer);if(!pinned)showTooltip(el)};el.onmouseleave=scheduleHide;
 el.onfocus=()=>{if(!pinned)showTooltip(el)};el.onblur=scheduleHide;
 el.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();pinned=el;showTooltip(el)};
 el.onclick=e=>{e.stopPropagation();if(el.dataset.action){acquireCard(el);return}if(pinned===el)hideTooltip(true);else{pinned=el;showTooltip(el)}};
 el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!e.repeat)el.click()}}
})}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.body.classList.toggle('blue',b.dataset.theme==='blue');document.querySelectorAll('[data-theme]').forEach(t=>t.classList.toggle('active',t===b))});document.querySelector('#continue').onclick=()=>mode==='battle'&&document.querySelector('#enemy-health')?.dataset.health!=='0'?playBattle():setMode(mode==='encounter'?'shop':'encounter');document.addEventListener('click',e=>{if(!e.target.closest('#tooltip'))hideTooltip(true)});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTooltip(true)});addEventListener('resize',()=>{if(activeCard?.isConnected)positionTooltip(activeCard)});addEventListener('scroll',()=>{if(pinned?.isConnected)positionTooltip(pinned);else hideTooltip()});document.querySelector('#hero-portrait').style.setProperty('--portrait',`url('${ASSETS.hero}')`);document.querySelector('#hero-skills').innerHTML=['smite','defend','charge'].map((k,i)=>`<span class="skill" title="${['至圣斩','防御','冲锋'][i]}" style="--skill-art:url('${ASSETS[k]}')"></span>`).join('')+'<small>3 项技能 · 1 个套装</small>';drawStage();drawBoards();
const detailsPanel=document.querySelector('#tooltip');detailsPanel.onmouseenter=()=>clearTimeout(hideTimer);detailsPanel.onmouseleave=scheduleHide;
document.querySelectorAll('[data-progress]').forEach(button=>button.onclick=e=>{e.stopPropagation();questProgress=Number(button.dataset.progress);document.querySelectorAll('[data-progress]').forEach(b=>b.classList.toggle('active',b===button));const card=document.querySelector('#battlefield [data-card="ascendant"]');pinned=card;showTooltip(card);button.blur()});
const firstQuestCard=document.querySelector('#battlefield [data-card="ascendant"]');pinned=firstQuestCard;showTooltip(firstQuestCard);
</script></body></html>

function previewCardSnapshot(){
 const {key,source,level}=cardPreview,levels=detailLevels[key],current=levels?.[source.level]??{},selected=levels?.[level]??{};
 const value=source.value+source.span*(2**(Math.min(level,4)-1)-2**(Math.min(source.level,4)-1));
 const effects=source.effects.map(([kind,amount])=>[kind,selected[kind]===undefined?amount:Number(amount)+(selected[kind]-(current[kind]??selected[kind]))]);
 if(key==='toad')effects.find(([kind])=>kind==='poison')[1]=value;
 return {...source,level,value,cool:selected.cool??source.cool,effects};
}
function renderCardPreview(){
 const c=previewCardSnapshot(),gems=cardPreview.gems;
 document.querySelector('#card-preview-title').textContent=c.name;
 document.querySelector('#card-preview-art').innerHTML=cardHTML(cardPreview.key,'',0,false,'',c,gems);
 const face=document.querySelector('#card-preview-art .card');face.removeAttribute('tabindex');face.setAttribute('role','img');face.setAttribute('aria-label',`${c.name}，${c.level}级预览`);
 document.querySelector('#card-preview-meta').innerHTML=`<strong>${c.level}级</strong><span>${c.tags.filter(t=>!t.includes('套装')).join(' · ')}</span>${c.cool!=null?`<span>冷却 <strong>${c.cool}秒</strong></span>`:''}<span>价值 <strong>${c.value}</strong></span>`;
 document.querySelector('#card-preview-rules').innerHTML=`<div class="preview-rule-header"><div class="tagrow">${c.tags.map(t=>`<span>${t.replace(/属性$/,'')}</span>`).join('')}</div>${c.cool!=null?`<div class="cool-circle"><small>冷却</small>${Number(c.cool).toFixed(1)}<small>秒</small></div>`:''}</div><h3>卡牌效果</h3>${cardDescription(c).map(text=>`<p>${text}</p>`).join('')}${gemDetailsHTML(c,gems)}${setDetailsHTML(c)}${questHTML(c)}`;
 const related=cardPreviewDialog.querySelector('.preview-related');if(related)related.remove();const panel=document.createElement('aside');panel.className='preview-related';panel.innerHTML=detailExplanationsHTML(c);if(panel.firstElementChild)cardPreviewDialog.querySelector('.card-preview-layout').append(panel);
 cardPreviewDialog.querySelectorAll('[data-preview-level]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.previewLevel)===c.level)));
 cardPreviewDialog.querySelectorAll('[data-preview-gem]').forEach(select=>select.value=gems[Number(select.dataset.previewGem)]?.name??'');
 colorAttributes(document.querySelector('#card-preview-rules'));
}
function openCardPreview(el){
 hideTooltip(true);const key=el.dataset.card,source=cards[key],gems=previewSockets.get(el.dataset.instance)??source.previewGems??[];
 cardPreview={key,source,level:source.level,gems:Array.from({length:source.sockets??1},(_,i)=>gems[i]??null),anchor:el};
 const levels=Object.keys(detailLevels[key]??{[source.level]:{}});
 document.querySelector('#card-preview-options').innerHTML=`<h3>等级预览</h3><div class="preview-levels">${levels.map(level=>`<button class="subtlebtn" data-preview-level="${level}" style="--rank:${rarity[level]}" aria-pressed="${Number(level)===source.level}">${level}级</button>`).join('')}</div><h3>宝石预览</h3>${cardPreview.gems.length?cardPreview.gems.map((_,i)=>`<div class="preview-gem-row"><label for="preview-gem-${i}">宝石 ${i+1}</label><select id="preview-gem-${i}" data-preview-gem="${i}" ${source.cool?'':'disabled'}><option value="">空孔</option>${detailGems.map(gem=>`<option value="${gem.name}">${gem.name}</option>`).join('')}</select></div>`).join(''):'<small>无宝石孔</small>'}${source.cool?'':'<small>此卡牌不可镶嵌</small>'}<button class="subtlebtn preview-reset" id="preview-reset">还原当前卡牌</button><small>仅预览 · 不改变当前卡牌</small>`;
 cardPreviewDialog.querySelectorAll('[data-preview-level]').forEach(button=>button.onclick=()=>{cardPreview.level=Number(button.dataset.previewLevel);renderCardPreview()});
 cardPreviewDialog.querySelectorAll('[data-preview-gem]').forEach(select=>select.onchange=()=>{cardPreview.gems[Number(select.dataset.previewGem)]=detailGems.find(gem=>gem.name===select.value)??null;renderCardPreview()});
 document.querySelector('#preview-reset').onclick=()=>{cardPreview.level=source.level;cardPreview.gems=Array.from({length:source.sockets??1},(_,i)=>gems[i]??null);renderCardPreview()};
 const origin=el.getBoundingClientRect();
 renderCardPreview();cardPreviewDialog.showModal();
 const face=cardPreviewDialog.querySelector('#card-preview-art .card'),target=face.getBoundingClientRect();
 const dx=origin.x+origin.width/2-target.x-target.width/2,dy=origin.y+origin.height/2-target.y-target.height/2;
 cardPreviewDialog.getAnimations({subtree:true}).forEach(animation=>animation.cancel());
 const frames=Array.from({length:31},(_,i)=>{const t=i/30,e=1-(1-t)**4;return {offset:t,transform:`translate(${dx*(1-e)}px,${dy*(1-e)-Math.sin(t*Math.PI)*18}px) scale(${origin.width/target.width+(1-origin.width/target.width)*e},${origin.height/target.height+(1-origin.height/target.height)*e})`}});
 face.animate(frames,{duration:420,easing:'linear'});
 cardPreviewDialog.querySelectorAll('.card-preview-info,.preview-related,.card-preview-meta,.card-preview-visual h2').forEach(node=>node.animate([{opacity:0},{opacity:1}],{duration:180,delay:180,fill:'backwards'}));
 cardPreviewDialog.querySelector('.detail-close').focus();
}
cardPreviewDialog.querySelector('.detail-close').onclick=()=>cardPreviewDialog.close();
cardPreviewDialog.addEventListener('close',()=>{const anchor=cardPreview?.anchor;cardPreview=null;if(anchor?.isConnected)anchor.focus()});
</script>

<script id="centered-match-interactions">
// 只重排既有预览组件，上下区域各占局内画布的一半。
const matchTable=document.createElement('div');matchTable.className='match-table';matchTable.setAttribute('aria-hidden','true');
matchTable.innerHTML='<div class="table-plinth"></div><div class="table-rim"><div class="table-surface"><div class="table-compass">✧</div></div></div><div class="inn-prop nw"></div><div class="inn-prop ne"></div><div class="inn-prop sw"></div><div class="inn-prop se"></div>';
layoutApp.prepend(matchTable);
// 主按钮直接属于画布，与阶段内容分开命中。
const stageAction=document.querySelector('.hero-right');stageAction.classList.add('stage-action');
// 属性已由下面的HUD转换移入血条，主操作层只在转换完成后移出英雄组件。
// 保留既有b数值节点，战斗刷新继续更新同一护甲值。
document.querySelectorAll('.hero-panel .stats > span').forEach((item,index)=>{
 const name=index===0?'护甲':'生命再生',icon=index===0?'armor':'regeneration';
 const value=item.querySelector('b');item.classList.add('hud-emblem',icon,'hud-hint');item.tabIndex=0;
 item.dataset.hint=index===0?'护甲：优先抵扣普通伤害与灼伤伤害。':'生命再生：每秒恢复显示数值的生命，不超过最大生命。';
 item.replaceChildren();item.insertAdjacentHTML('beforeend',`<span class="hud-label">${name}</span><svg aria-hidden="true"><use href="#i-${icon}"/></svg>`);item.append(value);
});
document.querySelectorAll('.hero-meta > span').forEach((item,index)=>{
 const name=['经验','声望','胜场'][index],icon=['experience','reputation','victories'][index],value=item.querySelector('b');
 item.classList.add('hud-hint');item.tabIndex=0;item.dataset.hint=['经验：每10点提升一级。','声望：降至0时对局失败。','胜场：累计PvP胜利进度。'][index];
 item.replaceChildren();item.insertAdjacentHTML('beforeend',`<span class="hud-label">${name}</span><svg aria-hidden="true"><use href="#i-${icon}"/></svg>`);item.append(value);
});
document.querySelectorAll('.hero-panel .bars .bar').forEach((bar,index)=>bar.insertAdjacentHTML('beforeend',`<svg class="resource-symbol" aria-hidden="true"><use href="#i-${index===0?'health':'mana'}"/></svg>`));
document.querySelector('.hero-panel .bars .bar').append(document.querySelector('.hero-panel .stats'));
document.querySelector('.hero-panel .bars .mana').insertAdjacentHTML('beforeend','<span class="mana-regeneration hud-hint" tabindex="0" data-hint="魔法再生：每秒恢复显示数值的魔法，不超过最大魔法。" aria-label="魔法再生5">+5</span>');
layoutApp.append(stageAction);
const playerField=document.querySelector('#battlefield').parentElement;
playerField.classList.add('player-field');
playerField.querySelector('h2').firstChild.textContent='己 方 战 场';
const benchDrawer=document.querySelector('#bench').parentElement;
benchDrawer.classList.add('bench-drawer');benchDrawer.id='bench-drawer';benchDrawer.hidden=true;
benchDrawer.setAttribute('aria-label','备战区');benchDrawer.querySelector('.board-heading h2').firstChild.textContent='备战区 · 不参战';
benchDrawer.insertAdjacentHTML('afterbegin','<button class="drawer-close" aria-label="收起备战区">×</button>');
const upperIdentity=document.createElement('section');upperIdentity.className='upper-identity';upperIdentity.setAttribute('aria-label','当前遭遇');
layoutApp.append(upperIdentity);
const layoutDock=document.createElement('div');layoutDock.className='layout-dock';
layoutDock.innerHTML='<button class="subtlebtn" id="bench-toggle" aria-expanded="false" aria-controls="bench-drawer" title="点击打开备用卡牌；再次点击、关闭按钮或Escape收起"><b class="bench-action">打开备战</b><span></span></button><button class="subtlebtn" id="layout-preview-tools">预览工具</button>';
layoutApp.append(layoutDock);
document.querySelector('.hero-panel').append(economyDock,layoutDock);
const benchToggle=document.querySelector('#bench-toggle');
function toggleBench(open){
 if(open&&mode==='battle'){toast('战斗中保持敌方战场可见，备战区在战斗外打开');return}
 benchDrawer.hidden=!open;document.querySelector('#stage').hidden=open;document.body.classList.toggle('bench-open',open);
 benchToggle.setAttribute('aria-expanded',String(open));benchToggle.querySelector('.bench-action').textContent=open?'收起备战':'打开备战';
 hideTooltip(true);if(!open)benchToggle.focus();
}
benchToggle.onclick=()=>toggleBench(benchDrawer.hidden);
benchDrawer.querySelector('.drawer-close').onclick=()=>toggleBench(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!benchDrawer.hidden&&!document.querySelector('dialog[open]'))toggleBench(false)});
const previewTools=document.createElement('dialog');previewTools.className='ui-dialog layout-tools-dialog';previewTools.setAttribute('aria-label','预览工具');
previewTools.innerHTML='<button class="detail-close" aria-label="关闭预览工具">×</button><h2>预览工具</h2>';
previewTools.append(document.querySelector('.modebar'),layoutTools);document.body.append(previewTools);
previewTools.querySelector('.detail-close').onclick=()=>previewTools.close();
document.querySelector('#layout-preview-tools').onclick=()=>previewTools.showModal();
previewTools.addEventListener('click',e=>{if(e.target.closest('.case-buttons button,.scenario-list button'))previewTools.close()});
function refreshCenteredLayout(){
 document.querySelectorAll('#stage .offer').forEach(offer=>offer.style.setProperty('--offer-span',offer.querySelector('.card')?.style.getPropertyValue('--span')||'2'));
 upperIdentity.hidden=mode==='battle';
 benchToggle.disabled=mode==='battle';
 benchToggle.title=mode==='battle'?'战斗中保留敌方战场，备战区暂不可打开':'点击打开备用卡牌；再次点击、关闭按钮或Escape收起';
 const side=document.querySelector('#stage .stage-side');
 if(side){upperIdentity.innerHTML='<div class="upper-portrait"></div><strong></strong><small></small>';upperIdentity.querySelector('.upper-portrait').style.setProperty('--identity-art',side.style.getPropertyValue('--stage-art'));upperIdentity.querySelector('strong').textContent=side.querySelector('h1').textContent;upperIdentity.querySelector('small').textContent=side.querySelector('.eyebrow').textContent}
 benchToggle.querySelector('span').textContent=document.querySelector('#bench-count').textContent;
}
const centeredStage=drawStage;drawStage=function(){centeredStage();refreshCenteredLayout()};
const centeredBoards=drawBoards;drawBoards=function(){centeredBoards();refreshCenteredLayout()};
const centeredMode=setMode;setMode=function(next){toggleBench(false);centeredMode(next)};
// 事件样例会在drawStage之后替换内容，按最终内容更新遭遇头像。
new MutationObserver(refreshCenteredLayout).observe(document.querySelector('#stage'),{childList:true});
document.querySelector('.previewtag').textContent='上下等分 · 中轴布局';
drawStage();refreshCenteredLayout();fitLayout();
</script>

<script id="card-preview-tilt">
// 预览表现层：稳定的透视容器承载卡面，后续光栅与特效层可叠加在卡面内。
const tiltStage=document.querySelector('#card-preview-art');
const tiltHint=document.createElement('p');tiltHint.className='preview-tilt-hint';tiltHint.textContent='按住卡面拖动 · 松开回正';tiltStage.after(tiltHint);
let previewTiltDrag=null;
function resetPreviewTilt(){const drag=previewTiltDrag;previewTiltDrag=null;tiltStage.classList.remove('tilting');tiltStage.style.removeProperty('--tilt-x');tiltStage.style.removeProperty('--tilt-y');if(drag&&tiltStage.hasPointerCapture(drag.id))tiltStage.releasePointerCapture(drag.id);}
tiltStage.addEventListener('pointerdown',event=>{
 if(event.button!==0||previewTiltDrag||!event.target.closest('.card')||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 event.preventDefault();const bounds=tiltStage.getBoundingClientRect();previewTiltDrag={id:event.pointerId,x:event.clientX,y:event.clientY,width:bounds.width,height:bounds.height};tiltStage.setPointerCapture(event.pointerId);tiltStage.classList.add('tilting');
});
tiltStage.addEventListener('pointermove',event=>{
 const drag=previewTiltDrag;if(!drag||drag.id!==event.pointerId)return;
 const clamp=value=>Math.max(-18,Math.min(18,value));
 tiltStage.style.setProperty('--tilt-x',clamp(-(event.clientY-drag.y)/Math.max(drag.height,1)*48)+'deg');
 tiltStage.style.setProperty('--tilt-y',clamp((event.clientX-drag.x)/Math.max(drag.width,1)*48)+'deg');
});
for(const type of ['pointerup','pointercancel','lostpointercapture'])tiltStage.addEventListener(type,event=>{if(previewTiltDrag?.id===event.pointerId)resetPreviewTilt()});
cardPreviewDialog.addEventListener('close',resetPreviewTilt);window.addEventListener('blur',resetPreviewTilt);window.addEventListener('resize',resetPreviewTilt);
const renderPreviewBeforeTilt=renderCardPreview;renderCardPreview=function(){resetPreviewTilt();renderPreviewBeforeTilt()};
</script>

<script id="tooltip-source-avoidance-behavior">
const positionTooltipBeforeAvoidance=positionTooltip;
positionTooltip=function(el){
 positionTooltipBeforeAvoidance(el);
 const tip=document.querySelector('#tooltip'),r=el.getBoundingClientRect(),related=tip.querySelector(':scope > .detail-explanations'),gap=16,margin=12;
 const right=innerWidth-margin-r.right-gap,left=r.left-gap-margin,w=420,rw=related?326:0;
 let x,rx;
 if(right>=w+rw){x=r.right+gap;rx=x+w+gap;}
 else if(left>=w+rw){x=r.left-w-gap;rx=x-rw;}
 else if(right>=left){x=r.right+gap;rx=x+w+gap;}
 else{x=r.left-w-gap;rx=x-rw;}
 tip.style.width=w+'px';tip.style.left=x+'px';tip.style.top=Math.max(margin,Math.min(innerHeight-tip.offsetHeight-margin,r.top))+'px';
 if(related)related.style.left=(rx-x)+'px';
};
scheduleHide=function(){hideTooltip(true)};
document.querySelector('#tooltip').onmouseenter=null;
document.querySelector('#tooltip').onmouseleave=null;
bindCards();
</script>

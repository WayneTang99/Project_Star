  if(next==='mixed'){if(i===0){state.haste=3;state.flight=true;}if(i===1)state.slow=4;if(i===2)state.stop=3;if(i===3){state.haste=3;state.slow=2;}if(i===4)state.rage=true;}
  if(next==='destroyed'&&i===2)state.destroyed=true;
  if(next==='charge'&&i===1)state.remaining=Math.max(0,state.remaining-1);
  demoCards.set(key,state);
 });

}
function pill(kind,symbol,name,seconds){return `<span class="combat-pill ${kind}" title="${name}，剩余${seconds.toFixed(1)}秒">${symbol}<em>${name}</em> ${seconds.toFixed(1)}s</span>`;}
function updateCombat(){
 const active=mode==='battle';
 document.querySelectorAll('#battlefield .card').forEach(el=>{
  const key=el.dataset.card,state=demoCards.get(key);if(!state)return;
  let layer=el.querySelector('.battle-layer');if(!layer){layer=document.createElement('div');layer.className='battle-layer';el.append(layer);}
  layer.hidden=!active;
  const speed=state.stop>0?0:state.haste>0&&state.slow>0?1:state.haste>0?2:state.slow>0?.5:1;
  el.classList.toggle('is-haste',active&&speed===2);el.classList.toggle('is-slow',active&&speed===.5);el.classList.toggle('is-stopped',active&&state.stop>0);el.classList.toggle('is-destroyed',active&&state.destroyed);
  el.classList.toggle('is-flying',active&&state.flight);el.classList.toggle('is-berserk',active&&state.rage);
  if(!active)return;
  if(state.destroyed){layer.innerHTML='<span class="destroyed-label">× 已摧毁</span>';return;}
  const total=cards[key].cool,percent=Math.max(0,Math.min(100,(1-state.remaining/total)*100));
  layer.innerHTML=`<div class="activation-track" role="progressbar" aria-label="${cards[key].name}发动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(percent)}"><div class="activation-fill" style="--ready:${percent}%"></div></div><span class="activation-clock" title="剩余冷却${state.remaining.toFixed(1)}秒 · 当前速度×${speed}">${state.stop>0?'Ⅱ ':''}${state.remaining.toFixed(1)}s</span><div class="combat-pills">${state.haste>0?pill('haste','↗','疾速',state.haste):''}${state.slow>0?pill('slow','↘','迟缓',state.slow):''}${state.stop>0?pill('stop','▣','禁锢',state.stop):''}${state.flight?'<span class="combat-pill fly" title="飞行：新受迟缓和禁锢时长减半">↟<em>飞行</em></span>':''}${state.rage?'<span class="combat-pill rage" title="狂暴：自身发动的伤害及施毒、灼伤量提高20%">✹<em>狂暴</em></span>':''}</div>${state.stop>0?'<span class="combat-lock"></span>':''}<span class="activation-flash"></span><span class="charge-pop">✦ 充能 +1秒</span>`;
 });
 const dots=active&&(scenario==='dots'||scenario==='mixed');
 renderDotRow(document.querySelector('.player-status'),playerDot,dots);
 renderDotRow(document.querySelector('.enemy-status'),enemyDot,dots);
 const playerLabel=document.querySelector('.hero-panel .bars .bar-label'),playerFill=document.querySelector('.hero-panel .bars .bar-fill');
 playerLabel.textContent=`${playerDot.health} / 600`;playerFill.style.setProperty('--progress',`${playerDot.health/6}%`);
 const armor=document.querySelector('.hero-right .stats b');armor.textContent=playerDot.armor;
 if(active){document.querySelector('#enemy-label').textContent=`${enemyDot.health} / 600`;document.querySelector('#enemy-health').style.setProperty('--progress',`${enemyDot.health/6}%`);document.querySelector('#play').textContent=playing?'暂停':'播放动效';document.querySelector('#battle-status').textContent=playing?'交锋中':'表现预览';}
}
function renderDotRow(row,state,visible){
 if(!row)return;row.hidden=!visible;if(!visible)return;
 for(const [kind,symbol,name,amount,period] of [['armor','◇','护甲',state.armor,''],['burn','♨','灼伤',state.burn,'0.6s'],['poison','♧','中毒',state.poison,'1.0s']]){
  if(kind==='armor'&&row.classList.contains('player-status'))continue;
  let chip=row.querySelector(`.${kind}`);if(!chip){chip=document.createElement('span');chip.className=`dot-chip ${kind}`;row.append(chip);}
  chip.hidden=kind==='burn'&&amount<=0;
  chip.title=kind==='burn'?'每0.6秒伤害，先扣护甲；结算后灼伤-1':kind==='poison'?'每1秒伤害，无视护甲；不衰减':'承受普通伤害与灼伤伤害时优先扣除';
  chip.innerHTML=`${symbol} ${name} <b>${amount}</b>${period?`<small>／${period}</small>`:''}`;
 }
}
function pulse(el,cls,time=500){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),time);}
function tickDots(state,row,delta){
 if(scenario!=='dots'&&scenario!=='mixed')return;
 state.burnClock+=delta;state.poisonClock+=delta;
 if(state.burnClock>=.6){state.burnClock-=.6;const damage=state.burn,absorbed=Math.min(state.armor,damage);state.armor-=absorbed;state.health=Math.max(0,state.health-damage+absorbed);state.burn=Math.max(0,state.burn-1);pulse(row?.querySelector('.burn'),'tick',350);}
 if(state.poisonClock>=1){state.poisonClock-=1;state.health=Math.max(0,state.health-state.poison);pulse(row?.querySelector('.poison'),'tick',350);}
}
playBattle=function(){playing=!playing;document.querySelector('#battlefield').classList.toggle('battle-active',playing);updateCombat();};
finishBattle=function(){applyScenario(scenario);toast('已重置战斗表现示例');};
function animate(now){
 const delta=Math.min(.05,lastFrame?(now-lastFrame)/1000:0);lastFrame=now;
 if(playing&&mode==='battle'&&!document.hidden){
  elapsed+=delta;
  for(const [key,state] of demoCards){
   if(state.destroyed)continue;
   const speed=state.stop>0?0:state.haste>0&&state.slow>0?1:state.haste>0?2:state.slow>0?.5:1;
   state.remaining=Math.max(0,state.remaining-delta*speed);
   for(const flag of ['haste','slow','stop'])state[flag]=Math.max(0,state[flag]-delta);
   if(state.remaining===0){state.remaining=cards[key].cool;pulse(document.querySelector(`#battlefield [data-card="${key}"]`),'has-fired');}
  }
  tickDots(playerDot,document.querySelector('.player-status'),delta);tickDots(enemyDot,document.querySelector('.enemy-status'),delta);updateCombat();
 }
 requestAnimationFrame(animate);
}
hideTooltip(true);applyScenario('mixed');setMode('battle');requestAnimationFrame(animate);

document.body.insertAdjacentHTML('beforeend',`<dialog class="ui-dialog recovery-dialog" id="recovery-dialog" aria-labelledby="recovery-title"><button class="detail-close" aria-label="关闭恢复配色对比">×</button><h2 id="recovery-title">生命与恢复 · 三种配色</h2><p class="recovery-intro">数字统一浅象牙白，卡面构图不变。选择方案只改变本页预览；魔法回复用紫色，魔法再生用蓝紫色；默认方案把生命、治疗与生命再生分开。</p><div class="recovery-options">${recoveryPalettes.map(p=>`<section class="palette-card" data-recovery-option="${p.key}" style="${recoveryPaletteStyle(p)}"><h3>${p.name}</h3><p>${p.note}</p><div class="bar-title" style="color:var(--attr-health)">${icon('health')}生命</div><div class="bar"><div class="bar-fill" style="--progress:75%"></div><div class="bar-label">450 / 600</div></div><div class="bar-title" style="color:var(--attr-mana)">${icon('mana')}魔法</div><div class="bar mana"><div class="bar-fill" style="--progress:80%"></div><div class="bar-label">80 / 100</div></div><div class="recovery-pair">${cardHTML('potion')}<div class="recovery-stats"><div class="recovery-token heal">${icon('healing')}治疗 <b>＋80</b></div><div class="recovery-token healthregen">${icon('healthregen')}生命再生 <b>10</b><small>/s</small></div><div class="recovery-token" style="color:var(--attr-mana)">${icon('mana')}魔法回复 <b>＋20</b></div><div class="recovery-token manaregen">${icon('manaregen')}魔法再生 <b>5</b><small>/s</small></div></div></div><div class="recovery-caption">十字／魔法符号：一次回复<br>资源符号＋循环箭头：每秒再生</div><button class="goldbtn" data-recovery-palette="${p.key}" aria-pressed="false">预览此方案</button></section>`).join('')}</div><div class="burn-explanation"><span class="attr attr-burn">${icon('burn')} 灼伤</span>使用琥珀色。卡面显示施加量，敌方状态显示当前量与0.6s周期；每次结算优先扣护甲，结算后灼伤－1。<br><span class="attr attr-poison">${icon('poison')} 中毒</span>使用草绿色，每1秒伤害且无视护甲，本场战斗内不衰减。</div></dialog>`);
const recoveryDialog=document.querySelector('#recovery-dialog');
const recoveryTools=document.createElement('div');recoveryTools.className='case-group';recoveryTools.innerHTML=`<span>生命／恢复与灼伤</span><div class="case-buttons"><button class="subtlebtn" id="open-recovery-colors">三种配色对比</button><button class="subtlebtn" id="show-burn-example">灼伤卡面与详情</button><button class="subtlebtn" id="show-regeneration-example">生命／魔法再生</button></div><p class="regeneration-guide"><span class="attr attr-healthregen">${icon('healthregen')} 生命再生：每1秒恢复生命</span><br><span class="attr attr-manaregen">${icon('manaregen')} 魔法再生：每1秒恢复魔法</span></p>`;cases.querySelector('.attribute-key').before(recoveryTools);
const recoveryLegend=cases.querySelector('.attribute-key');recoveryLegend.innerHTML=recoveryLegend.innerHTML.replace('● 再生','● 生命再生');recoveryLegend.insertAdjacentHTML('beforeend','<span class="attr attr-manaregen">● 魔法再生</span>');
function previewRecoveryPalette(key){const p=recoveryPalettes.find(item=>item.key===key);if(!p)return;for(const [name,value] of Object.entries({health:p.health,healing:p.healing,healthregen:p.healthregen,regen:p.healthregen,manaregen:'#99a9ff'}))document.documentElement.style.setProperty('--attr-'+name,value);document.documentElement.dataset.recoveryPalette=key;recoveryDialog.querySelectorAll('[data-recovery-option]').forEach(panel=>{const selected=panel.dataset.recoveryOption===key;panel.classList.toggle('selected',selected);const button=panel.querySelector('[data-recovery-palette]');button.setAttribute('aria-pressed',String(selected));button.textContent=selected?'当前预览方案':'预览此方案'});}
document.querySelector('#open-recovery-colors').onclick=()=>dialogOpen('#recovery-dialog');recoveryDialog.querySelector('.detail-close').onclick=()=>dialogClose(recoveryDialog);recoveryDialog.addEventListener('cancel',e=>{e.preventDefault();dialogClose(recoveryDialog)});
recoveryDialog.querySelectorAll('[data-recovery-palette]').forEach(button=>button.onclick=()=>previewRecoveryPalette(button.dataset.recoveryPalette));
function showRecoverySamples(key){hideTooltip(true);benchKeys=['potion','burnPreview','recoveryPreview'];drawBoards();detailCase(key);}
document.querySelector('#show-burn-example').onclick=()=>{showRecoverySamples('burnPreview');setMode('battle');applyScenario('dots')};document.querySelector('#show-regeneration-example').onclick=()=>showRecoverySamples('recoveryPreview');
previewRecoveryPalette('distinct');benchKeys=['potion','burnPreview','recoveryPreview'];drawBoards();
</script></body></html>
